building_types:
  # Primary targets
  - Industrial
  - Warehouse
  - Factory
  - Cold Store
  # Secondary (need manual review)
  - Commercial
  # Large agricultural sheds
  - Agricultural

# Building footprint thresholds
min_footprint_m2: 200
preferred_footprint_m2: 500

# Allowed zoning classifications (TheLIST zone names)
# Note: TheLIST uses coded format like "24.0 Light Industrial", "23.0 Commercial"
# No "General Industrial" exists in TheLIST - using General Business as equivalent
allowed_zones:
  - "24.0 Light Industrial"
  - "23.0 Commercial"
  - "21.0 General Business"

# Output paths
output:
  raw_leads: "data/raw/raw_leads_{region}.parquet"
  scored_leads: "data/processed/scored_leads_{region}.parquet"
  qualified_leads: "data/processed/qualified_leads_{region}.parquet"
  outreach: "data/processed/outreach_{region}.parquet"

# TheLIST WFS endpoint
thelist:
  wfs_url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/OpenDataWFS/MapServer"
  building_layer_id: 13
  zoning_layer_id: 4
  address_layer_id: 9

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
